<title>번역 및 패러프레이징 앱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* 레이아웃: artifact-board 탭 보고판과 같은 틀 — 위 큰 탭(nav.top) → 작은 칩(nav.sub) → 좌 입력 / 우 결과 두 칸(.two) */
:root{--bg:#f4f6f9;--paper:#fff;--ink:#18202c;--muted:#5d6676;--line:#dce1e8;--accent:#2f5fb3;--accent-soft:#e6eefb;
--good:#1f7a4d;--good-soft:#e2f3ea;--warn:#946300;--warn-soft:#fbf0d6;--bad:#a63232;--bad-soft:#f8e3e3;--mute-soft:#eceef2;
--f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;--f-head:"Noto Serif KR","Malgun Gothic",serif;--f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11151c;--paper:#19202a;--ink:#e5e9f0;--muted:#99a3b3;--line:#2b3442;
--accent:#8fb2ff;--accent-soft:#1f2b45;--good:#6fd3a0;--good-soft:#16342a;--warn:#e6c063;--warn-soft:#382e17;--bad:#f09090;--bad-soft:#3b2022;--mute-soft:#262c36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151c;--paper:#19202a;--ink:#e5e9f0;--muted:#99a3b3;--line:#2b3442;
--accent:#8fb2ff;--accent-soft:#1f2b45;--good:#6fd3a0;--good-soft:#16342a;--warn:#e6c063;--warn-soft:#382e17;--bad:#f09090;--bad-soft:#3b2022;--mute-soft:#262c36;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.75;margin:0;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:22px}h2{font-size:19px}h3{font-size:16px}
p{margin:6px 0}
.meta{color:var(--muted);font-size:13.5px}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
.ok{background:var(--good-soft);color:var(--good)}.mid{background:var(--warn-soft);color:var(--warn)}
.no{background:var(--bad-soft);color:var(--bad)}.ac{background:var(--accent-soft);color:var(--accent)}.mute{background:var(--mute-soft);color:var(--muted)}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--mute-soft);padding:1px 4px;border-radius:3px}
/* 머리 */
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head .sp{flex:1}
.head select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:4px 8px}
/* 탭 */
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{font:inherit;cursor:pointer;border:1px solid transparent;background:none;color:var(--muted)}
nav.top{border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:6px}
nav.top button{font-size:15.5px;font-weight:700;padding:9px 16px;border-bottom:3px solid transparent;margin-bottom:-2px}
nav.top button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.sub{gap:6px;margin:0;align-items:center}
nav.sub button{font-size:13.5px;padding:5px 12px;border-radius:999px;border-color:var(--line);background:var(--paper);color:var(--ink)}
nav.sub button:hover{border-color:var(--accent);color:var(--accent)}
nav.sub button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
nav.sub .sep{color:var(--muted);font-size:13px;padding:0 4px}
nav button:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 두 칸 */
.two{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:6px;background:var(--paper);overflow:hidden}
.two>div{min-width:0;display:flex;flex-direction:column}
.two>div+div{border-left:1px solid var(--line)}
@media (max-width:760px){.two{grid-template-columns:1fr}.two>div+div{border-left:0;border-top:1px solid var(--line)}}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13.5px;min-height:44px}
.bar.bottom{border-bottom:0;border-top:1px solid var(--line);justify-content:space-between}
.cnt{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);background:var(--mute-soft);border-radius:4px;padding:1px 7px;font-variant-numeric:tabular-nums}
textarea{font:inherit;font-size:15px;line-height:1.7;color:var(--ink);background:var(--paper);border:0;padding:14px;width:100%;min-height:300px;resize:vertical;outline:none}
textarea:focus-visible{box-shadow:inset 0 0 0 2px var(--accent-soft)}
.out{padding:14px;min-height:300px;white-space:pre-wrap;flex:1;line-height:1.75;font-size:15px}
.out.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;font-size:14px}
.out ins{background:var(--good-soft);color:var(--good);text-decoration:none;border-radius:3px;padding:0 2px}
.out del{background:var(--bad-soft);color:var(--bad);border-radius:3px;padding:0 2px}
.notes{border-top:1px dashed var(--line);margin:0 14px 10px;padding-top:8px;font-size:13.5px}
.notes ul{margin:4px 0;padding-left:1.3em}.notes li{margin:3px 0}
button.act{font:inherit;font-size:13.5px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:5px;padding:5px 12px}
button.act:hover{border-color:var(--accent);color:var(--accent)}
button.act[disabled]{opacity:.5;cursor:default;border-color:var(--line);color:var(--muted)}
button.act.main{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600;padding:6px 16px}
button.act.main:hover{filter:brightness(1.08);color:var(--paper)}
button.act.main[disabled]{background:var(--mute-soft);border-color:var(--line);color:var(--muted);filter:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{font-size:13px;color:var(--muted)}
.msg.err{color:var(--bad)}.msg.good{color:var(--good)}
select.lang{font:inherit;font-size:13.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:4px 8px}
input.txt{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%;min-width:0}
/* 기록 */
.hist{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--bg);font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.hist .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hist .q,.hist .a{white-space:pre-wrap;max-height:6.5em;overflow:hidden;position:relative}
.hist .a{border-left:3px solid var(--good);padding-left:10px}
.hist.open .q,.hist.open .a{max-height:none}
.foot{font-size:12.5px;color:var(--muted)}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){.out.busy::after{content:"";display:inline-block;width:8px;height:1em;background:var(--accent);vertical-align:text-bottom;animation:bl 1s steps(2) infinite}}
@keyframes bl{to{opacity:0}}
</style>

<div class="wrap">
  <div class="head">
    <h1>번역 및 패러프레이징 앱</h1>
    <span class="sp"></span>
    <label class="meta" for="tier">답 모델</label>

  </div>

  <nav class="top" role="tablist" aria-label="기능">

    <button type="button" role="tab" data-tab="translate" aria-selected="false">번역</button>
    <button type="button" role="tab" data-tab="history" aria-selected="false">기록 <span id="histn" class="chip mute">0</span></button>
  </nav>

  <!-- ===== 다듬기 ===== -->
  <section id="tab-polish" role="tabpanel">
    <div class="panel">
      <nav class="sub" aria-label="언어" id="p-lang">
        <button type="button" data-v="en" aria-selected="true">영어</button>
        <button type="button" data-v="ko" aria-selected="false">한국어</button>
      </nav>
      <nav class="sub" aria-label="방식" id="p-mode">
        <button type="button" data-v="fix" aria-selected="true">교정</button>
        <span class="sep">패러프레이즈 ·</span>
        <button type="button" data-v="standard" aria-selected="false">표준</button>
        <button type="button" data-v="formal" aria-selected="false">격식</button>
        <button type="button" data-v="academic" aria-selected="false">학술적</button>
        <button type="button" data-v="simple" aria-selected="false">쉽게</button>
        <button type="button" data-v="shorter" aria-selected="false">짧게</button>
        <button type="button" data-v="longer" aria-selected="false">길게</button>
        <button type="button" data-v="casual" aria-selected="false">비격식</button>
        <button type="button" data-v="cover" aria-selected="false" data-ko="1">자기소개서</button>
        <button type="button" data-v="report" aria-selected="false" data-ko="1">보고서</button>
        <button type="button" data-v="article" aria-selected="false" data-ko="1">기사</button>
      </nav>
      <div class="two">
        <div>
          <div class="bar"><span>단어 <span class="cnt" id="p-w">0</span></span><span>글자 <span class="cnt" id="p-c">0</span></span><span class="sp" style="flex:1"></span><span class="msg" id="p-hint"></span></div>
          <textarea id="p-in" placeholder="영어 글을 여기에 적거나 붙여 넣으세요 (같은 언어로 교정·패러프레이즈)" aria-label="다듬을 글"></textarea>
          <div class="bar bottom"><button type="button" class="act" id="p-copy-in">복사하기</button><div class="row"><button type="button" class="act" id="p-clear">지우기</button><button type="button" class="act main" id="p-run" disabled>교정하기</button></div></div>
        </div>
        <div>
          <div class="bar"><span>결과</span><span class="msg" id="p-msg"></span><span class="sp" style="flex:1"></span><button type="button" class="act" id="p-stop" hidden>멈추기</button></div>
          <div class="out empty" id="p-out">교정한 글이 여기에 뜹니다. 바뀐 낱말은 색으로 표시됩니다.</div>
          <div class="notes hidden" id="p-notes"></div>
          <div class="bar bottom"><button type="button" class="act" id="p-copy-out" disabled>결과 복사</button><div class="row"><button type="button" class="act" id="p-again" disabled>다시</button><button type="button" class="act" id="p-use" disabled>결과를 입력으로</button><button type="button" class="act" id="p-tr" disabled>번역으로 보내기</button></div></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 번역하기 ===== -->
  <section id="tab-translate" role="tabpanel" hidden>
    <div class="panel">
      <div class="row">
        <select class="lang" id="t-src" aria-label="원문 언어"><option value="auto">언어 감지</option><option value="ko">한국어</option><option value="en">영어</option><option value="ja">일본어</option><option value="zh">중국어</option></select>
        <button type="button" class="act" id="t-swap" title="바꾸기">⇄</button>
        <select class="lang" id="t-dst" aria-label="번역 언어"><option value="ko">한국어</option><option value="en" selected>영어</option><option value="ja">일본어</option><option value="zh">중국어</option></select>
        <span class="msg" id="t-det"></span>
      </div>
      <nav class="sub" aria-label="문체" id="t-style">
        <button type="button" data-v="standard" aria-selected="true">표준</button>
        <button type="button" data-v="formal" aria-selected="false">격식</button>
        <button type="button" data-v="academic" aria-selected="false">학술적</button>
        <button type="button" data-v="casual" aria-selected="false">비격식</button>
        <button type="button" data-v="bullet" aria-selected="false">개조식</button>
        <button type="button" data-v="legal" aria-selected="false">법률</button>
        <button type="button" data-v="literary" aria-selected="false">문학</button>
        <button type="button" data-v="shorter" aria-selected="false">짧게</button>
        <button type="button" data-v="simple" aria-selected="false">쉽게</button>
      </nav>
      <div class="two">
        <div>
          <div class="bar"><span>단어 <span class="cnt" id="t-w">0</span></span><span>글자 <span class="cnt" id="t-c">0</span></span></div>
          <textarea id="t-in" placeholder="다른 언어로 번역할 글을 여기에 적거나 붙여 넣으세요" aria-label="번역할 글"></textarea>
          <div class="bar bottom"><button type="button" class="act" id="t-copy-in">복사하기</button><div class="row"><button type="button" class="act" id="t-clear">지우기</button><button type="button" class="act main" id="t-run" disabled>번역하기</button></div></div>
        </div>
        <div>
          <div class="bar"><span>단어 <span class="cnt" id="t-ow">0</span></span><span>글자 <span class="cnt" id="t-oc">0</span></span><span class="msg" id="t-msg"></span><span class="sp" style="flex:1"></span><button type="button" class="act" id="t-stop" hidden>멈추기</button></div>
          <div class="out empty" id="t-out">번역한 글이 여기에 뜹니다.</div>
          <div class="bar bottom"><button type="button" class="act" id="t-copy-out" disabled>결과 복사</button><div class="row"><button type="button" class="act" id="t-again" disabled>다시</button><button type="button" class="act" id="t-para" disabled title="번역 결과가 생기면 그 글을 교정·패러프레이즈 탭으로 보냅니다">패러프레이즈</button><button type="button" class="act" id="t-fix" disabled title="번역 결과가 생기면 그 글을 교정·패러프레이즈 탭으로 보냅니다">교정하기</button></div></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 기록 ===== -->
  <section id="tab-history" role="tabpanel" hidden>
    <div class="panel">
      <div class="row"><h2 style="flex:1">기록</h2><input class="txt" id="h-q" placeholder="검색" style="max-width:240px"><button type="button" class="act" id="h-clear">전체 삭제</button></div>
      <p class="meta">교정·패러프레이즈·번역 결과가 쌓입니다. 저장소가 있으면 claude.ai에 영구 저장되고, 없으면 이 브라우저에만 남습니다.</p>
      <div id="h-list" style="display:flex;flex-direction:column;gap:8px"><div class="msg">아직 기록이 없습니다.</div></div>
    </div>
  </section>

  <div class="foot">Claude 호출은 보는 사람의 claude.ai 사용량으로 나갑니다(첫 사용 때 동의 창). 결과는 반드시 직접 확인한 뒤 쓰세요. · app 1.1.1</div>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var el=function(t,a,c){var e=document.createElement(t);if(a)for(var k in a){if(k==='class')e.className=a[k];else e.setAttribute(k,a[k]);}if(c!=null)e.textContent=c;return e;};
var LS=function(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}};

/* ---------- 지시문 (수정은 여기서) ---------- */
var LANGNAME={ko:'Korean',en:'English',ja:'Japanese',zh:'Chinese',auto:''};
var STYLE={
  standard:'Rewrite in a natural, standard register. Keep the meaning, length and tone roughly the same.',
  formal:'Rewrite in a formal, polite register suitable for official documents or professional email.',
  academic:'Rewrite in an academic register suitable for a peer-reviewed physics/optics paper: precise, hedged where appropriate, no colloquialisms, consistent terminology.',
  simple:'Rewrite so that a non-expert can follow: shorter sentences, plain words, no jargon unless defined.',
  shorter:'Rewrite more concisely. Remove redundancy; aim for about 60-70% of the original length without losing any claim.',
  longer:'Rewrite more fully. Expand compressed phrases, add connective tissue and clarifying detail, but invent no new facts.',
  casual:'Rewrite in a relaxed, conversational register, as one colleague speaking to another.',
  cover:'Rewrite as a self-introduction letter (자기소개서) paragraph: first person, concrete achievements, confident but not boastful.',
  report:'Rewrite as a formal report (보고서) passage: objective, structured, declarative sentences, Korean formal written style (-다/-함 체) when the text is Korean.',
  article:'Rewrite as a news article passage: lead with the key fact, short paragraphs, neutral tone.',
  bullet:'Render as concise bullet points (개조식), one idea per line, noun-ending phrases, no filler.',
  legal:'Use precise legal register: defined terms, unambiguous obligations, formal connectives.',
  literary:'Use a literary register: rhythm, imagery and varied sentence length, while keeping the meaning.'
};
function fixRules(lang){
  return 'You are a careful copy editor for '+(lang==='ko'?'Korean':'English')+' text written by a physicist (laser/photonics research). '+
  'Correct grammar, spelling, punctuation, word choice, agreement, articles/particles and awkward phrasing. Keep the author\'s meaning, voice, terminology, numbers, units, LaTeX, citations and formatting exactly. Do not add or remove content. Do not translate.\n'+
  'Output format, strictly:\n'+
  '1. The full corrected text only (no preamble, no quotes).\n'+
  '2. A line containing only ---\n'+
  '3. Up to 8 bullet lines starting with "- " explaining the important changes in Korean: "원문 → 수정: 이유". If nothing needed changing, write "- 고칠 곳이 없습니다."';
}
function paraRules(lang,style){
  return 'You rewrite '+(lang==='ko'?'Korean':'English')+' text for a physicist (laser/photonics research). '+STYLE[style]+
  ' Preserve every fact, number, unit, LaTeX expression, citation and the original language. Output only the rewritten text, no preamble, no quotes, no explanation.';
}
function trRules(src,dst,style){
  return 'Translate the text '+(src==='auto'?'(detect its language) ':'from '+LANGNAME[src]+' ')+'into '+LANGNAME[dst]+'. Domain: physics / laser / photonics research; use standard technical terminology and keep numbers, units, LaTeX, citations, line breaks and list structure. '+
  STYLE[style]+'\nOutput format, strictly: first line "LANG: <detected source language in English>", then a line containing only ---, then the translation only. No other commentary.';
}

/* ---------- 공통 ---------- */
var sampleP=window.claude?claude.use('sample'):Promise.resolve(null);
var dbP=window.claude?claude.use('db'):Promise.resolve(null);
var tier=$('tier');tier.value=LS('tier')||'quick';if(!tier.value)tier.value='quick';tier.addEventListener('change',function(){LS('tier',tier.value);});
/* 모델 선택: 빠름 = Haiku 5.5 · 깊게 = Sonnet 5.5, 둘 다 effort medium. 그 모델을 못 쓰는 계정이면 claude.ai가 같은 등급(modelTier)으로 대신 답함 */
var MODELS={quick:{model:'claude-haiku-5-5',modelTier:'quick',effort:'medium',label:'Haiku 5.5'},deep:{model:'claude-sonnet-5-5',modelTier:'default',effort:'medium',label:'Sonnet 5.5'}};
function modelOpts(){return MODELS[tier.value]||MODELS.quick;}
function appliedLabel(r){var m=modelOpts();if(r.modelApplied)return m.label+' · medium';return ({quick:'빠름 등급',default:'보통 등급',complex:'깊게 등급'}[r.modelTierApplied]||'')+' (대신 답함)';}
function wc(s){s=s.trim();return s?s.split(/\s+/).length:0;}
function cc(s){return Array.from(s).length;}
function fmt(n){return n.toLocaleString('en-US');}
function copyText(t,btn){var old=btn.textContent;function done(ok){btn.textContent=ok?'복사됨':'복사 실패';setTimeout(function(){btn.textContent=old;},1200);}
  try{navigator.clipboard.writeText(t).then(function(){done(true);},function(){fallback();});}catch(e){fallback();}
  function fallback(){try{var ta=el('textarea');ta.value=t;document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);done(ok);}catch(e){done(false);}}}
function setOut(box,text,empty){box.classList.toggle('empty',!!empty);box.textContent=text;}
function sub(nav,cb){nav.addEventListener('click',function(e){var b=e.target.closest('button[data-v]');if(!b||b.disabled)return;nav.querySelectorAll('button[data-v]').forEach(function(x){x.setAttribute('aria-selected',x===b?'true':'false');});cb(b.dataset.v);});}
function val(nav){var b=nav.querySelector('button[aria-selected="true"]');return b?b.dataset.v:null;}
function pick(nav,v){nav.querySelectorAll('button[data-v]').forEach(function(x){x.setAttribute('aria-selected',x.dataset.v===v?'true':'false');});}
function errText(e){if(!e)return '오류';if(e.code==='not_granted')return 'Claude 호출이 허용되지 않았습니다.';if(e.code==='rate_limited')return '잠시 후 다시 시도하세요 (사용량 제한).';if(e.code==='aborted'||e.name==='AbortError')return '멈췄습니다.';return e.message||String(e);}
/* 한 번의 Claude 호출: 스트리밍 표시, 멈추기, 오류 */
async function ask(prompt,box,msgEl,stopBtn,onText){
  var s=await sampleP;if(!s){msgEl.className='msg err';msgEl.textContent='이 화면에서는 Claude를 부를 수 없습니다 (claude.ai에서 여세요).';return null;}
  var ctl=new AbortController();stopBtn.hidden=false;stopBtn.onclick=function(){ctl.abort();};
  box.classList.remove('empty');box.classList.add('busy');box.textContent='생각하는 중…';msgEl.className='msg';msgEl.textContent='';
  try{
    var mo=modelOpts();var r=await s(prompt,{model:mo.model,modelTier:mo.modelTier,effort:mo.effort,cache:false,signal:ctl.signal,onText:function(u){box.textContent=onText?onText(u.text):u.text;}});
    msgEl.textContent=(r.truncated?'답이 잘렸습니다. 글을 나눠서 다시 해 보세요. ':'')+'· '+appliedLabel(r);
    return r.text;
  }catch(e){msgEl.className='msg err';msgEl.textContent=errText(e);if(e&&e.text){return e.text;}return null;}
  finally{stopBtn.hidden=true;box.classList.remove('busy');}
}
/* 단어 단위 diff (LCS) → ins/del 표시 */
function tokens(s){return s.match(/\S+|\s+/g)||[];}
function diffHTML(a,b){
  var A=tokens(a),B=tokens(b);if(A.length*B.length>4e6){return null;}
  var n=A.length,m=B.length,L=new Array((n+1)*(m+1)).fill(0),W=m+1;
  for(var i=n-1;i>=0;i--)for(var j=m-1;j>=0;j--)L[i*W+j]=A[i]===B[j]?L[(i+1)*W+j+1]+1:Math.max(L[(i+1)*W+j],L[i*W+j+1]);
  var out=document.createDocumentFragment(),i2=0,j2=0,dl='',ins='';
  function flush(){if(dl.trim()){out.appendChild(el('del',null,dl));}else if(dl)out.appendChild(document.createTextNode(dl));if(ins.trim()){out.appendChild(el('ins',null,ins));}else if(ins)out.appendChild(document.createTextNode(ins));dl='';ins='';}
  while(i2<n&&j2<m){if(A[i2]===B[j2]){flush();out.appendChild(document.createTextNode(A[i2]));i2++;j2++;}else if(L[(i2+1)*W+j2]>=L[i2*W+j2+1]){dl+=A[i2++];}else{ins+=B[j2++];}}
  while(i2<n)dl+=A[i2++];while(j2<m)ins+=B[j2++];flush();return out;
}
function splitNotes(t){var k=t.indexOf('\n---');if(k<0)return [t.trim(),''];return [t.slice(0,k).trim(),t.slice(k+4).trim()];}
function renderNotes(box,notes){box.innerHTML='';if(!notes){box.classList.add('hidden');return;}box.classList.remove('hidden');var ul=el('ul');notes.split('\n').forEach(function(l){l=l.replace(/^\s*[-*•]\s*/,'').trim();if(l)ul.appendChild(el('li',null,l));});box.appendChild(el('div',{class:'label'},'바뀐 곳'));box.appendChild(ul);}

/* ---------- 저장(db / localStorage) ---------- */
var db=null,hist=[];
var dbstat=$('dbstat');
function localLoad(){try{hist=JSON.parse(LS('hist')||'[]');}catch(e){hist=[];}}
function localSave(){LS('hist',JSON.stringify(hist.slice(0,200)));}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
async function saveHist(rec){rec.id=newId();rec.at=new Date().toISOString();
  if(db){try{await db.doc('history/'+rec.id).set(rec);return;}catch(e){console.warn(e);}}
  hist.unshift(rec);localSave();renderHist();}
async function delHist(id){if(db){try{await db.doc('history/'+id).delete();return;}catch(e){}}hist=hist.filter(function(h){return h.id!==id;});localSave();renderHist();}
localLoad();renderHist();
dbP.then(function(d){
  if(!d){dbstat.textContent='이 브라우저에만 저장';dbstat.className='chip mute';return;}
  db=d;dbstat.textContent='저장소 연결됨';dbstat.className='chip ok';
  var t1=setTimeout(function(){dbstat.textContent='저장소 응답 없음';dbstat.className='chip mid';},10000);
  d.collection('history').orderBy('at','desc').limit(300).onSnapshot(function(snap){clearTimeout(t1);hist=snap.docs.map(function(x){return x.data();});renderHist();},function(e){clearTimeout(t1);dbstat.textContent='저장소 오류';dbstat.className='chip no';console.warn(e);});
});

/* ---------- 큰 탭 ---------- */
var TABS=['polish','translate','history'];
function showTab(t){if(TABS.indexOf(t)<0)t='polish';document.querySelectorAll('nav.top button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===t?'true':'false');});TABS.forEach(function(x){$('tab-'+x).hidden=x!==t;});if(location.hash!=='#'+t){try{history.replaceState(null,'',"#"+t);}catch(e){}}}
document.querySelector('nav.top').addEventListener('click',function(e){var b=e.target.closest('button[data-tab]');if(b)showTab(b.dataset.tab);});
window.addEventListener('hashchange',function(){showTab(location.hash.slice(1));});
showTab(location.hash.slice(1)||LS('tab')||'polish');

/* ---------- 다듬기 ---------- */
var pIn=$('p-in'),pOut=$('p-out'),pRun=$('p-run'),pLast={text:'',out:''};
var pLang='en',pMode='fix';
function pUI(){var ko=pLang==='ko';
  $('p-mode').querySelectorAll('button[data-ko]').forEach(function(b){b.hidden=!ko;});
  if(!ko&&['cover','report','article'].indexOf(pMode)>=0){pMode='standard';pick($('p-mode'),'standard');}
  pIn.placeholder=ko?'한국어 글을 여기에 적거나 붙여 넣으세요 (같은 언어로 교정·패러프레이즈)':'영어 글을 여기에 적거나 붙여 넣으세요 (같은 언어로 교정·패러프레이즈)';
  $('p-hint').textContent=pMode==='fix'?(ko?'맞춤법·띄어쓰기·문법·어색한 표현을 고칩니다':'문법·철자·관사·어색한 표현을 고칩니다'):'뜻은 그대로 두고 표현을 바꿉니다';
  pRun.textContent=pMode==='fix'?'교정하기':'패러프레이즈';
  if(pOut.classList.contains('empty'))pOut.textContent=pMode==='fix'?'교정한 글이 여기에 뜹니다. 바뀐 낱말은 색으로 표시됩니다.':'패러프레이즈한 글이 여기에 뜹니다.';
  pCount();}
function pCount(){var t=pIn.value;$('p-w').textContent=fmt(wc(t));$('p-c').textContent=fmt(cc(t));pRun.disabled=!t.trim();}
sub($('p-lang'),function(v){pLang=v;pUI();});sub($('p-mode'),function(v){pMode=v;pUI();});
pIn.addEventListener('input',pCount);pUI();
$('p-clear').onclick=function(){pIn.value='';pCount();pIn.focus();};
$('p-copy-in').onclick=function(){copyText(pIn.value,this);};
$('p-copy-out').onclick=function(){copyText(pLast.out,this);};
$('p-use').onclick=function(){pIn.value=pLast.out;pCount();pIn.focus();};
$('p-tr').onclick=function(){$('t-in').value=pLast.out;tCount();showTab('translate');};
async function runPolish(){
  var text=pIn.value.trim();if(!text)return;pRun.disabled=true;$('p-notes').classList.add('hidden');
  ['p-copy-out','p-again','p-use','p-tr'].forEach(function(i){$(i).disabled=true;});
  var isFix=pMode==='fix';
  var prompt=(isFix?fixRules(pLang):paraRules(pLang,pMode))+'\n\nTEXT:\n'+text;
  var raw=await ask(prompt,pOut,$('p-msg'),$('p-stop'),isFix?function(t){return splitNotes(t)[0]||t;}:null);
  pRun.disabled=false;if(raw==null){setOut(pOut,'결과를 받지 못했습니다.',true);return;}
  var out=raw.trim(),notes='';
  if(isFix){var sp=splitNotes(raw);out=sp[0];notes=sp[1];var frag=diffHTML(text,out);pOut.textContent='';if(frag)pOut.appendChild(frag);else pOut.textContent=out;renderNotes($('p-notes'),notes);}
  else{pOut.textContent=out;}
  pLast={text:text,out:out};['p-copy-out','p-again','p-use','p-tr'].forEach(function(i){$(i).disabled=false;});
  saveHist({tool:isFix?'교정':'패러프레이즈',lang:pLang,mode:pMode,input:text,output:out,notes:notes.slice(0,4000),tier:tier.value});
}
pRun.onclick=runPolish;$('p-again').onclick=runPolish;

/* ---------- 번역하기 ---------- */
var tIn=$('t-in'),tOut=$('t-out'),tRun=$('t-run'),tLast={text:'',out:''},tStyle='standard';
function tCount(){var t=tIn.value;$('t-w').textContent=fmt(wc(t));$('t-c').textContent=fmt(cc(t));tRun.disabled=!t.trim();}
function tOutCount(t){$('t-ow').textContent=fmt(wc(t));$('t-oc').textContent=fmt(cc(t));}
tIn.addEventListener('input',tCount);sub($('t-style'),function(v){tStyle=v;});
var CHUNK=5000;
function chunks(t){var out=[],cur='';t.split(/\n{2,}/).forEach(function(p){if(cur&&cc(cur)+cc(p)>CHUNK){out.push(cur);cur='';}if(cc(p)>CHUNK){var s=p.split(/(?<=[.!?。])\s+/);s.forEach(function(x){if(cur&&cc(cur)+cc(x)>CHUNK){out.push(cur);cur='';}cur+=(cur?' ':'')+x;});}else{cur+=(cur?'\n\n':'')+p;}});if(cur)out.push(cur);return out;}
function tDetect(head){var m=/^LANG:\s*(.+)$/m.exec(head||'');if(m){$('t-det').textContent='감지: '+m[1].trim();var l=m[1].toLowerCase();$('t-det').dataset.l=/korean/.test(l)?'ko':/japan/.test(l)?'ja':/chin/.test(l)?'zh':'en';}}
async function runTr(){
  var text=tIn.value.trim();if(!text)return;tRun.disabled=true;['t-copy-out','t-again','t-para','t-fix'].forEach(function(i){$(i).disabled=true;});
  var src=$('t-src').value,dst=$('t-dst').value,rules=trRules(src,dst,tStyle),out='';
  var parts=cc(text)>CHUNK*1.2?chunks(text):[text];
  for(var i=0;i<parts.length;i++){
    if(parts.length>1){$('t-msg').className='msg';$('t-msg').textContent=(i+1)+' / '+parts.length+' 조각 옮기는 중';}
    var done=out;
    var raw=await ask(rules+'\n\nTEXT:\n'+parts[i],tOut,$('t-msg'),$('t-stop'),function(t){var sp=splitNotes(t);return done+(done?'\n\n':'')+(sp[1]||(t.indexOf('---')<0&&!/^LANG:/.test(t)?t:'…'));});
    if(raw==null){tRun.disabled=false;if(!out){setOut(tOut,'결과를 받지 못했습니다.',true);return;}break;}
    var sp=splitNotes(raw);if(i===0)tDetect(sp[0]);out+=(out?'\n\n':'')+(sp[1]||sp[0]).trim();
  }
  tRun.disabled=false;if(parts.length>1&&$('t-msg').className!=='msg err'){$('t-msg').className='msg good';$('t-msg').textContent=parts.length+' 조각을 모두 옮겼습니다.';}
  tOut.textContent=out;tOutCount(out);tLast={text:text,out:out};['t-copy-out','t-again','t-para','t-fix'].forEach(function(i){$(i).disabled=false;});
  saveHist({tool:'번역',lang:src+'→'+dst,mode:tStyle,input:text.slice(0,20000),output:out.slice(0,60000),tier:tier.value});
}
tRun.onclick=runTr;$('t-again').onclick=runTr;tCount();

/* ---------- 기록 ---------- */
function renderHist(){var box=$('h-list'),q=($('h-q').value||'').toLowerCase();box.innerHTML='';
  var list=hist.filter(function(h){return !q||(h.input+' '+h.output+' '+h.tool).toLowerCase().indexOf(q)>=0;});
  $('histn').textContent=hist.length;
  if(!list.length){box.appendChild(el('div',{class:'msg'},hist.length?'검색 결과가 없습니다.':'아직 기록이 없습니다.'));return;}
  list.slice(0,200).forEach(function(h){var d=el('div',{class:'hist'});var hd=el('div',{class:'h'});
    hd.appendChild(el('span',{class:'chip ac'},h.tool));hd.appendChild(el('span',{class:'chip mute'},(h.lang||'')+(h.mode?' · '+h.mode:'')));hd.appendChild(el('span',{class:'meta'},(h.at||'').replace('T',' ').slice(0,16)));
    var sp=el('span',{style:'flex:1'});hd.appendChild(sp);
    var b1=el('button',{type:'button',class:'act'},'펼치기');b1.onclick=function(){d.classList.toggle('open');b1.textContent=d.classList.contains('open')?'접기':'펼치기';};
    var b2=el('button',{type:'button',class:'act'},'결과 복사');b2.onclick=function(){copyText(h.output||'',b2);};
    var b3=el('button',{type:'button',class:'act'},'다시 열기');b3.onclick=function(){if(h.tool==='번역'){tIn.value=h.input;tCount();tOut.textContent=h.output;tOut.classList.remove('empty');tOutCount(h.output);tLast={text:h.input,out:h.output};['t-copy-out','t-again','t-para','t-fix'].forEach(function(i){$(i).disabled=false;});showTab('translate');}
      else{pIn.value=h.input;pLang=h.lang||'en';pick($('p-lang'),pLang);pMode=h.mode||'fix';pick($('p-mode'),pMode);pUI();pOut.classList.remove('empty');var fr=pMode==='fix'?diffHTML(h.input,h.output):null;pOut.textContent='';if(fr)pOut.appendChild(fr);else pOut.textContent=h.output;renderNotes($('p-notes'),h.notes||'');pLast={text:h.input,out:h.output};['p-copy-out','p-again','p-use','p-tr'].forEach(function(i){$(i).disabled=false;});showTab('polish');}};
    var b4=el('button',{type:'button',class:'act'},'삭제');b4.onclick=function(){if(b4.dataset.c){delHist(h.id);}else{b4.dataset.c='1';b4.textContent='정말?';setTimeout(function(){b4.dataset.c='';b4.textContent='삭제';},2500);}};
    [b1,b2,b3,b4].forEach(function(b){hd.appendChild(b);});d.appendChild(hd);
    d.appendChild(el('div',{class:'q'},h.input||''));d.appendChild(el('div',{class:'a'},h.output||''));box.appendChild(d);});}
$('h-q').addEventListener('input',renderHist);
$('h-clear').onclick=async function(){var b=this;if(!b.dataset.c){b.dataset.c='1';b.textContent='정말 전부 삭제?';setTimeout(function(){b.dataset.c='';b.textContent='전체 삭제';},3000);return;}
  b.dataset.c='';b.textContent='전체 삭제';var ids=hist.map(function(h){return h.id;});if(db){for(var i=0;i<ids.length;i++){try{await db.doc('history/'+ids[i]).delete();}catch(e){}}}else{hist=[];localSave();renderHist();}};
document.querySelector('nav.top').addEventListener('click',function(e){var b=e.target.closest('button[data-tab]');if(b)LS('tab',b.dataset.tab);});
})();
</script>
